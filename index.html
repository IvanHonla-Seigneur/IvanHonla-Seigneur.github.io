<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
box-sizing: border-box;
}
body {
margin: 0;
font-family: Arial, sans-serif;
background-color: #0a0e1a;
color: #e5e7eb;
scroll-behavior: smooth;
}
header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 25px 60px;
flex-wrap: wrap;
}
.logo {
font-size: 22px;
font-weight: bold;
color: #34d399;
letter-spacing: 1px;
}
nav a {
color: #e5e7eb;
text-decoration: none;
margin-left: 30px;
font-size: 14px;
font-weight: bold;
letter-spacing: 0.5px;
}
nav a:hover {
color: #34d399;
}
.hero-wrapper {
display: flex;
align-items: center;
justify-content: space-between;
gap: 40px;
padding: 40px 60px;
flex-wrap: wrap;
}
.hero {
max-width: 620px;
flex: 1 1 420px;
}
.hero p.intro {
font-size: 40px;
font-weight: 800;
line-height: 1.25;
margin-bottom: 10px;
}
.hero .nom {
color: #ec4899;
}
.hero .metier {
color: #34d399;
}
.liens-sociaux {
margin: 25px 0;
}
.liens-sociaux a {
display: inline-flex;
align-items: center;
justify-content: center;
width: 42px;
height: 42px;
background-color: #ec4899;
border-radius: 8px;
margin-right: 12px;
color: white;
text-decoration: none;
font-size: 18px;
}
.liens-sociaux svg {
width: 20px;
height: 20px;
}
.boutons-hero {
display: flex;
gap: 20px;
margin-top: 30px;
flex-wrap: wrap;
}
.realisations {
display: flex;
flex-direction: column;
gap: 24px;
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 16px;
padding: 50px 40px;
flex: 1 1 320px;
max-width: 420px;
box-shadow: 0 0 40px rgba(99, 102, 241, 0.08);
}
.bouton {
text-decoration: none;
padding: 18px 35px;
border-radius: 8px;
font-weight: bold;
color: white;
text-align: center;
transition: opacity 0.2s, transform 0.2s;
}
.bouton:hover {
opacity: 0.85;
transform: translateY(-2px);
}
.marketing {
background-color: #2563eb;
}
.data {
background-color: #16a34a;
}
.contact-btn {
border: 2px solid transparent;
background: linear-gradient(#0a0e1a, #0a0e1a) padding-box,
linear-gradient(90deg, #6366f1, #ec4899) border-box;
color: #ffffff;
padding: 13px 33px;
border-radius: 50px;
text-decoration: none;
font-weight: bold;
text-transform: uppercase;
letter-spacing: 0.5px;
display: inline-flex;
align-items: center;
gap: 10px;
}
.contact-btn svg {
width: 18px;
height: 18px;
}
</style>
</head>
<body>

<header>
<div class="logo">IVAN HONLA-SEIGNEUR</div>
<nav>
<a href="#apropos">A PROPOS</a>
<a href="#experiences">EXPERIENCES</a>
<a href="#competences">COMPETENCES</a>
<a href="#education">EDUCATION</a>
</nav>
</header>

<div class="hero-wrapper">
<div class="hero">
<p class="intro">
Bonjour,<br>
Je suis <span class="nom">IVAN HONLA-SEIGNEUR</span>,<br>
specialise en <span class="metier">Marketing &amp; Data</span>.
</p>

<div class="liens-sociaux">
<a href="https://www.linkedin.com/" target="_blank" aria-label="LinkedIn">
<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.22 8.24h4.56V23H.22V8.24zm7.44 0h4.37v2.01h.06c.61-1.15 2.1-2.37 4.33-2.37 4.63 0 5.48 3.05 5.48 7.01V23h-4.56v-6.86c0-1.64-.03-3.75-2.29-3.75-2.29 0-2.64 1.79-2.64 3.63V23H7.66V8.24z"/></svg>
</a>
</div>

<div class="boutons-hero">
<a href="#contact" class="contact-btn">
Me contacter
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="9" cy="7" r="4"></circle>
<path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"></path>
<line x1="17" y1="8" x2="22" y2="8"></line>
<line x1="17" y1="12" x2="22" y2="12"></line>
</svg>
</a>
</div>
</div>

<div class="realisations">
<a href="marketing.html" class="bouton marketing">Mes realisations Marketing</a>
<a href="data.html" class="bouton data">Mes realisations Data</a>
</div>
</div>

</body>
</html>
